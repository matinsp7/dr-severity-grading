experiment_name: exp002_baseline

seed: 42

device: cuda

dataset:
  train_csv: data/train_1.csv
  valid_csv: data/valid.csv
  test_csv: data/test.csv


  train_dir: data/train_images
  valid_dir: data/val_images
  test_dir: data/test_images

  image_size: 384

  class_names:
    - "No DR"
    - "Mild"
    - "Moderate"
    - "Severe"
    - "Proliferative"

dataloader:
  batch_size: 16
  num_workers: 4
  pin_memory: true

model:
  name: efficientnet_b0
  pretrained: true
  num_classes: 5

optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.00001

scheduler:
  name: cosine
  t_max: 30

loss:
  name: focal_loss
  gamma: 0.2

trainer:
  epochs: 50
  patience: 15

output:
  save_dir: outputs

logging:
  enabled: true
  backend: wandb
  project: dr-severity-grading