experiment_name: exp007_imbalance_handling

seed: 42

device: cuda

dataset:
  train_csv: data/train_1.csv
  valid_csv: data/valid.csv
  test_csv: data/test.csv


  train_dir: data/train_images
  valid_dir: data/val_images
  test_dir: data/test_images

  image_size: 384

  class_names:
    - "No DR"
    - "Mild"
    - "Moderate"
    - "Severe"
    - "Proliferative"

dataloader:
  batch_size: 16
  num_workers: 4
  pin_memory: true

model:
  name: efficientnet_b0
  pretrained: true
  num_classes: 5

optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.00001

scheduler:
  name: cosine
  params:
    T_max: 50
loss:
  name: cross_entropy
  gamma: none

imbalance:
  use_class_weights: false
  use_weighted_sampler: true

trainer:
  epochs: 50
  patience: 15

output:
  save_dir: outputs

logging:
  enabled: true
  backend: wandb
  project: dr-severity-grading


augmentation:
  name: strong

  horizontal_flip:
    p: 0.5

  rotation:
    degrees: 30
    p: 0.5

  affine:
    translate: 0.05
    scale:
      min: 0.9
      max: 1.1
    rotate: 15
    p: 0.4

  color_jitter:
    brightness: 0.15
    contrast: 0.15
    saturation: 15
    hue: 10
    value: 10
    p: 0.5
    hue_p: 0.3

  gauss_noise:
    min: 0.012
    max: 0.028
    p: 0.3

  clahe:
    clip_limit: 2.0
    p: 0.3
